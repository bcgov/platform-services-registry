{{- $deploymentTag := .Values.image.tag | default .Chart.AppVersion -}}
{{- if not .Values.maintenance.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: application
  template:
    metadata:
      annotations:
      {{- $podAnnotations := merge (.Values.podAnnotations | default dict) (.Values.global.vault.podAnnotations | default dict) -}}
      {{- with $podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        vault.hashicorp.com/role: {{ .Values.global.vault.role }}
        vault.hashicorp.com/agent-inject-secret-secrets.env: {{ .Values.global.vault.role }}/{{ .Values.global.vault.subPath }}
        vault.hashicorp.com/agent-inject-template-secrets.env: |
          {{`{{ with secret "`}}{{ .Values.global.vault.role }}/{{ .Values.global.vault.subPath }}{{`" -}}
            export AUTH_RESOURCE='{{ .Data.data.AUTH_RESOURCE | replaceAll "'" "'\"'\"'" }}'
            export AUTH_SECRET='{{ .Data.data.AUTH_SECRET | replaceAll "'" "'\"'\"'"  }}'
            export NEXTAUTH_SECRET='{{ .Data.data.NEXTAUTH_SECRET | replaceAll "'" "'\"'\"'" }}'
            export KEYCLOAK_ADMIN_CLIENT_ID='{{ .Data.data.KEYCLOAK_ADMIN_CLIENT_ID | replaceAll "'" "'\"'\"'" }}'
            export KEYCLOAK_ADMIN_CLIENT_SECRET='{{ .Data.data.KEYCLOAK_ADMIN_CLIENT_SECRET | replaceAll "'" "'\"'\"'" }}'
            export MS_GRAPH_API_TENANT_ID='{{ .Data.data.MS_GRAPH_API_TENANT_ID | replaceAll "'" "'\"'\"'" }}'
            export MS_GRAPH_API_CLIENT_ID='{{ .Data.data.MS_GRAPH_API_CLIENT_ID | replaceAll "'" "'\"'\"'" }}'
            export MS_GRAPH_API_CLIENT_SECRET='{{ .Data.data.MS_GRAPH_API_CLIENT_SECRET | replaceAll "'" "'\"'\"'" }}'
            export MS_GRAPH_API_CLIENT_PRIVATE_KEY='{{ .Data.data.MS_GRAPH_API_CLIENT_PRIVATE_KEY | replaceAll "'" "'\"'\"'" }}'
            export MS_GRAPH_API_CLIENT_CERTIFICATE='{{ .Data.data.MS_GRAPH_API_CLIENT_CERTIFICATE | replaceAll "'" "'\"'\"'" }}'
            export FABRIC_TENANT_ID='{{ .Data.data.FABRIC_TENANT_ID | replaceAll "'" "'\"'\"'" }}'
            export FABRIC_CLIENT_ID='{{ .Data.data.FABRIC_CLIENT_ID | replaceAll "'" "'\"'\"'" }}'
            export FABRIC_CLIENT_SECRET='{{ .Data.data.FABRIC_CLIENT_SECRET | replaceAll "'" "'\"'\"'" }}'
            export FABRIC_WORKSPACE_ID='{{ .Data.data.FABRIC_WORKSPACE_ID | replaceAll "'" "'\"'\"'" }}'
            export FABRIC_AI_USAGE_TEAM_REPORT_ID='{{ .Data.data.FABRIC_AI_USAGE_TEAM_REPORT_ID | replaceAll "'" "'\"'\"'" }}'
            export FABRIC_AI_USAGE_CODE_QUALITY_REPORT_ID='{{ .Data.data.FABRIC_AI_USAGE_CODE_QUALITY_REPORT_ID | replaceAll "'" "'\"'\"'" }}'
            export DATABASE_URL='{{ .Data.data.DATABASE_URL | replaceAll "'" "'\"'\"'" }}'
            export CHES_CLIENT_ID='{{ .Data.data.CHES_CLIENT_ID | replaceAll "'" "'\"'\"'" }}'
            export CHES_CLIENT_SECRET='{{ .Data.data.CHES_CLIENT_SECRET | replaceAll "'" "'\"'\"'" }}'
            export AWS_ROLES_CLIENT_ID='{{ .Data.data.AWS_ROLES_CLIENT_ID | replaceAll "'" "'\"'\"'" }}'
            export AWS_ROLES_CLIENT_SECRET='{{ .Data.data.AWS_ROLES_CLIENT_SECRET | replaceAll "'" "'\"'\"'" }}'
            export GITHUB_APP_ID='{{ .Data.data.GITHUB_APP_ID | replaceAll "'" "'\"'\"'" }}'
            export GITHUB_APP_PRIVATE_KEY='{{ .Data.data.GITHUB_APP_PRIVATE_KEY | replaceAll "'" "'\"'\"'" }}'
            export GITHUB_BCGOV_INSTALLATION_ID='{{ .Data.data.GITHUB_BCGOV_INSTALLATION_ID | replaceAll "'" "'\"'\"'" }}'
            export GITHUB_BCGOV_C_INSTALLATION_ID='{{ .Data.data.GITHUB_BCGOV_C_INSTALLATION_ID | replaceAll "'" "'\"'\"'" }}'
            export CLAB_SERVICE_ACCOUNT_TOKEN='{{.Data.data.CLAB_SERVICE_ACCOUNT_TOKEN | replaceAll "'" "'\"'\"'" }}'
            export KLAB_SERVICE_ACCOUNT_TOKEN='{{.Data.data.KLAB_SERVICE_ACCOUNT_TOKEN | replaceAll "'" "'\"'\"'" }}'
            export KLAB2_SERVICE_ACCOUNT_TOKEN='{{.Data.data.KLAB2_SERVICE_ACCOUNT_TOKEN | replaceAll "'" "'\"'\"'" }}'
            export SILVER_SERVICE_ACCOUNT_TOKEN='{{.Data.data.SILVER_SERVICE_ACCOUNT_TOKEN | replaceAll "'" "'\"'\"'" }}'
            export GOLD_SERVICE_ACCOUNT_TOKEN='{{.Data.data.GOLD_SERVICE_ACCOUNT_TOKEN | replaceAll "'" "'\"'\"'" }}'
            export GOLDDR_SERVICE_ACCOUNT_TOKEN='{{.Data.data.GOLDDR_SERVICE_ACCOUNT_TOKEN | replaceAll "'" "'\"'\"'" }}'
            export EMERALD_SERVICE_ACCOUNT_TOKEN='{{.Data.data.EMERALD_SERVICE_ACCOUNT_TOKEN | replaceAll "'" "'\"'\"'" }}'
            export PUBLIC_ADMIN_EMAILS='{{.Data.data.PUBLIC_ADMIN_EMAILS | replaceAll "'" "'\"'\"'" }}'
            export PRIVATE_ADMIN_EMAILS='{{.Data.data.PRIVATE_ADMIN_EMAILS | replaceAll "'" "'\"'\"'" }}'
            export KLAB_METRICS_READER_TOKEN='{{.Data.data.KLAB_METRICS_READER_TOKEN | replaceAll "'" "'\"'\"'" }}'
            export KLAB2_METRICS_READER_TOKEN='{{.Data.data.KLAB2_METRICS_READER_TOKEN | replaceAll "'" "'\"'\"'" }}'
            export CLAB_METRICS_READER_TOKEN='{{.Data.data.CLAB_METRICS_READER_TOKEN | replaceAll "'" "'\"'\"'" }}'
            export SILVER_METRICS_READER_TOKEN='{{.Data.data.SILVER_METRICS_READER_TOKEN | replaceAll "'" "'\"'\"'" }}'
            export GOLDDR_METRICS_READER_TOKEN='{{.Data.data.GOLDDR_METRICS_READER_TOKEN | replaceAll "'" "'\"'\"'" }}'
            export GOLD_METRICS_READER_TOKEN='{{.Data.data.GOLD_METRICS_READER_TOKEN | replaceAll "'" "'\"'\"'" }}'
            export EMERALD_METRICS_READER_TOKEN='{{.Data.data.EMERALD_METRICS_READER_TOKEN | replaceAll "'" "'\"'\"'" }}'
            {{- if .Data.data.AIRFLOW_API_URL }}
            export AIRFLOW_API_URL='{{ .Data.data.AIRFLOW_API_URL | replaceAll "'" "'\"'\"'" }}'
            {{- end }}
            {{- if .Data.data.AIRFLOW_API_USERNAME }}
            export AIRFLOW_API_USERNAME='{{ .Data.data.AIRFLOW_API_USERNAME | replaceAll "'" "'\"'\"'" }}'
            {{- end }}
            {{- if .Data.data.AIRFLOW_API_PASSWORD }}
            export AIRFLOW_API_PASSWORD='{{ .Data.data.AIRFLOW_API_PASSWORD | replaceAll "'" "'\"'\"'" }}'
            {{- end }}
            {{- if .Data.data.AIRFLOW_FINANCE_DAG_ID }}
            export AIRFLOW_FINANCE_DAG_ID='{{ .Data.data.AIRFLOW_FINANCE_DAG_ID | replaceAll "'" "'\"'\"'" }}'
            {{- end }}
            {{- if .Data.data.PRIVATE_NATS_USERNAME }}
            export PRIVATE_NATS_USERNAME='{{ .Data.data.PRIVATE_NATS_USERNAME | replaceAll "'" "'\"'\"'" }}'
            {{- end }}
            {{- if .Data.data.PRIVATE_NATS_PASSWORD }}
            export PRIVATE_NATS_PASSWORD='{{ .Data.data.PRIVATE_NATS_PASSWORD | replaceAll "'" "'\"'\"'" }}'
            {{- end }}
            {{- if .Data.data.PUBLIC_NATS_USERNAME }}
            export PUBLIC_NATS_USERNAME='{{ .Data.data.PUBLIC_NATS_USERNAME | replaceAll "'" "'\"'\"'" }}'
            {{- end }}
            {{- if .Data.data.PUBLIC_NATS_PASSWORD }}
            export PUBLIC_NATS_PASSWORD='{{ .Data.data.PUBLIC_NATS_PASSWORD | replaceAll "'" "'\"'\"'" }}'
            {{- end }}
          {{- end }}`}}
      labels:
        {{- include "app.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: application
    spec:
      {{- $imagePullSecrets := concat (.Values.imagePullSecrets | default list) (.Values.global.imagePullSecrets | default list) -}}
      {{- with $imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ default .Values.global.serviceAccountName .Values.serviceAccountName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ $deploymentTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            ['. /vault/secrets/secrets.env && /workspace/app/node_modules/.bin/next start']
          env:
            - name: DEPLOYMENT_TAG
              value: {{ $deploymentTag | quote }}
          {{- $env := merge (.Values.global.env | default dict) (.Values.env | default dict) -}}
            {{- range $k, $v := $env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.envSecretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
