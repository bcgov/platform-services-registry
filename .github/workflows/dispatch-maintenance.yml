name: 06.Dispatch Maintenance

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]
      status:
        description: Maintenance status to set
        type: choice
        required: true
        options: ['true', 'false']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toggle-maintenance:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: ${{ inputs.environment }}

    steps:
    - uses: hmarr/debug-action@f7318c783045ac39ed9bb497e22ce835fdafbfe6
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      with:
        ref: main

    - name: Setup Helm
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      with:
        version: v3.21.4

    - name: Setup OpenShift
      uses: ./.github/actions/setup-openshift
      with:
        openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
        openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
        namespace: ${{ vars.OPENSHIFT_NAMESPACE }}

    - name: Deploy apps with Helm chart
      run: |
        helm dependency update
        helm upgrade pltsvc . \
        --reuse-values \
        --set app.maintenance.enabled=${{ inputs.status }} \
        -n ${{ vars.OPENSHIFT_NAMESPACE }} \
        -f values.yaml \
        -f values-${{ vars.OPENSHIFT_NAMESPACE }}.yaml
      working-directory: ./helm/main

    - name: Notify Notify MS Teams on Success
      if: success()
      uses: ./.github/actions/ms-teams-notification
      with:
        webhook-url: ${{ secrets.N8N_MSTEAMS_WEBHOOK_URL }}
        data: |
          {
             "title": "🚀 Maintenance Mode update",
             "body": "Maintenance Mode ${{ inputs.status }} deployed successfully in ${{ inputs.environment }}!"
           }

    - name: Notify Notify MS Teams on Failure
      if: failure()
      uses: ./.github/actions/ms-teams-notification
      with:
        webhook-url: ${{ secrets.N8N_MSTEAMS_WEBHOOK_URL }}
        data: |
          {
             "title": "⚠️ Maintenance Mode deployment failed",
             "body": "Environment: ${{ inputs.environment }}\nStatus requested: ${{ inputs.status }}"
           }
