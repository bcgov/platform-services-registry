name: 03.Deploy Prod Environment

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: prod
      url: https://registry.developer.gov.bc.ca

    steps:
    - uses: hmarr/debug-action@f7318c783045ac39ed9bb497e22ce835fdafbfe6
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      with:
        ref: main

    - name: Setup Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v3.21.4

    - name: Setup OpenShift
      uses: ./.github/actions/setup-openshift
      with:
        openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
        openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
        namespace: ${{ vars.OPENSHIFT_NAMESPACE }}

    - name: Deploy apps with Helm chart
      run: |
        vtag=${{ github.event.release.tag_name }}
        make upgrade NAMESPACE=${{ vars.OPENSHIFT_NAMESPACE }} IMAGE_TAG=${vtag//v}
        kubectl rollout status deployment/pltsvc-app
      working-directory: ./helm/main

    - name: Notify MS Teams on Success
      if: success()
      uses: ./.github/actions/ms-teams-notification
      with:
        webhook-url: ${{ secrets.N8N_MSTEAMS_WEBHOOK_URL }}
        data: |
          {
             "title": "🚀 Deployment to Prod was successful",
             "body": "Read the changes: https://github.com/bcgov/platform-services-registry/blob/main/CHANGELOG.md#${{ github.event.release.tag_name }}"
           }

    - name: Notify MS Teams on Failure
      if: failure()
      uses: ./.github/actions/ms-teams-notification
      with:
        webhook-url: ${{ secrets.N8N_MSTEAMS_WEBHOOK_URL }}
        data: |
          {
            "title": "⚠️ Deployment to Prod failed",
            "body": "Investigate: https://github.com/bcgov/platform-services-registry/"
          }
